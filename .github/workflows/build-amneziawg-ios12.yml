name: Build AmneziaWG iOS 12 IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Extract source
        run: unzip -q AmneziaWG-iOS12-arm64-source.zip && chmod +x AmneziaWG-iOS12/scripts/build-ios12.sh
      - name: Build unsigned IPA
        run: cd AmneziaWG-iOS12 && bash scripts/build-ios12.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AmneziaWG-iOS12-arm64-unsigned
          path: AmneziaWG-iOS12/dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-diagnostics
          path: |
            AmneziaWG-iOS12/build/xcodebuild.log
            AmneziaWG-iOS12/build/verification.txt
